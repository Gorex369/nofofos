{% extends "base.html" %}
{% block title %}Edit Attendance | Academic Tracker{% endblock %}
{% block content %}
<div class="page-heading">
    <div>
        <p class="text-primary fw-semibold mb-1">Attendance tracking</p>
        <h1 class="h2 mb-1">Edit attendance record</h1>
        <p class="text-secondary mb-0">Update the factual class record below.</p>
    </div>
</div>
{% if form_error %}<div class="alert alert-danger" role="alert">{{ form_error }}</div>{% endif %}
<section class="panel form-panel">
    <form method="post">
        <div class="row g-3">
            <div class="col-md-3"><label class="form-label" for="record_date">Date</label><input class="form-control" id="record_date" name="record_date" type="date" value="{{ record.record_date.isoformat() }}" required></div>
            <div class="col-md-3"><label class="form-label" for="status">Status</label><select class="form-select" id="status" name="status" required><option value="Present" {% if record.status == 'Present' %}selected{% endif %}>Present</option><option value="Absent" {% if record.status == 'Absent' %}selected{% endif %}>Absent</option></select></div>
            <div class="col-md-3"><label class="form-label" for="class_type">Class type</label><select class="form-select" id="class_type" name="class_type"><option value="" {% if not record.class_type %}selected{% endif %}>Not specified</option><option value="Lecture" {% if record.class_type == 'Lecture' %}selected{% endif %}>Lecture</option><option value="Lab" {% if record.class_type == 'Lab' %}selected{% endif %}>Lab</option></select></div>
            <div class="col-md-3"><label class="form-label" for="topic">Topic / description</label><input class="form-control" id="topic" name="topic" type="text" maxlength="255" value="{{ record.topic or '' }}"></div>
        </div>
        <div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Save changes</button><a class="btn btn-outline-secondary" href="{{ url_for('attendance', subject_id=record.subject_id) }}">Cancel</a></div>
    </form>
</section>
{% endblock %}
